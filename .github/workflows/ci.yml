name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # Cursor Agent CLI不支持Windows
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  setup-cursor-agent-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cursor Agent CLI (latest)
        uses: ./
        id: setup-cursor-agent-latest

      - name: Verify Cursor Agent CLI installation
        run: |
          echo "Cursor Agent CLI path: ${{ steps.setup-cursor-agent-latest.outputs.cursor-agent-path }}"
          echo "Version: ${{ steps.setup-cursor-agent-latest.outputs.cursor-agent-version }}"
          cursor-agent --version

      - name: Setup Cursor Agent CLI (specific version)
        uses: ./
        with:
          version: latest
        id: setup-cursor-agent-specific

      - name: Verify specific version
        run: |
          echo "Specific version path: ${{ steps.setup-cursor-agent-specific.outputs.cursor-agent-path }}"
          cursor-agent --version
